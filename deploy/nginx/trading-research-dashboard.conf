server {
    listen 80;
    server_name _;

    root /var/lib/trading-research-agent/outputs;
    index dashboard.html;

    location = / {
        try_files /dashboard.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jsonl|tmp)$ {
        deny all;
    }

    location ^~ /cache/ {
        deny all;
    }
}
